<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title class="modal-title">
      <span class="rocket-badge">🚀</span> Що нового
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="header-card">
    <div class="version-row">
      <h2>{{ update.title }}</h2>
      <ion-badge color="primary">v{{ update.version }}</ion-badge>
    </div>
    <p class="release-date">Реліз від {{ update.releaseDate }}</p>
  </div>

  <div class="update-groups">
    @for (group of update.groups; track group.category) {
      <div class="group-card">
        <h3 class="group-title">{{ group.category }}</h3>
        <ul class="items-list">
          @for (item of group.items; track item) {
            <li>
              <ion-icon name="checkmark-circle" color="success"></ion-icon>
              <span>{{ item }}</span>
            </li>
          }
        </ul>
      </div>
    }
  </div>
</ion-content>

<ion-footer class="ion-no-border ion-padding">
  <ion-button expand="block" shape="round" color="primary" (click)="dismiss()">
    Чудово, до тренувань!
  </ion-button>
</ion-footer>
