<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>{{ location ? 'Редагувати локацію' : 'Нова локація' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="form-container">
    <div class="form-group">
      <ion-label class="form-label">Назва локації</ion-label>
      <ion-item lines="none" class="custom-input-item">
        <ion-icon name="location-outline" slot="start" color="primary"></ion-icon>
        <ion-input type="text" [value]="name()" (ionInput)="name.set($any($event).detail.value)" placeholder="напр. Зал на Оболоні"></ion-input>
      </ion-item>
    </div>

    <div class="form-group ion-margin-top">
      <ion-label class="form-label">Адреса</ion-label>
      <ion-item lines="none" class="custom-input-item">
        <ion-icon name="map-outline" slot="start" color="primary"></ion-icon>
        <ion-input type="text" [value]="address()" (ionInput)="address.set($any($event).detail.value)" placeholder="Введіть адресу"></ion-input>
      </ion-item>
    </div>

    <div class="form-group ion-margin-top">
      <ion-label class="form-label">Тип локації</ion-label>
      <ion-segment [value]="type()" (ionChange)="type.set($any($event).detail.value)" mode="ios">
        <ion-segment-button value="STUDIO">
          <ion-icon name="business-outline"></ion-icon>
          <ion-label>Студія</ion-label>
        </ion-segment-button>
        <ion-segment-button value="GYM">
          <ion-icon name="barbell-outline"></ion-icon>
          <ion-label>Тренажерний зал</ion-label>
        </ion-segment-button>
        <ion-segment-button value="OUTDOOR">
          <ion-icon name="leaf-outline"></ion-icon>
          <ion-label>Вулиця</ion-label>
        </ion-segment-button>
      </ion-segment>
    </div>

    <div class="ion-margin-top ion-padding-top">
      <ion-button expand="block" shape="round" color="primary" class="submit-btn" (click)="confirm()" [disabled]="!name()">
        {{ location ? 'Зберегти зміни' : 'Створити локацію' }}
      </ion-button>
    </div>
  </div>
</ion-content>
